<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coral Bay Heat — an open-world crime game</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #17101d;
  }
  #game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: crosshair;
  }
  /* For screen readers only: a live line describing the game's state. */
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Coral Bay Heat: explore a coastal city on foot and by car, run missions, and outrun the police"></canvas>
<p id="status" role="status" aria-live="polite">Coral Bay Heat is loading.</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
